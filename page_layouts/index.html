{{ define "main" }}
<div class="category-filter" id="heroSection" style="margin-bottom: 2.5rem;">
  <a href="/" class="category-pill active">All Recipes</a>
  {{ range .Site.Taxonomies.categories }}
    <a href="{{ .Page.RelPermalink }}" class="category-pill">{{ .Page.Title }} ({{ .Count }})</a>
  {{ end }}
</div>

<section>
  <div id="searchResultsBanner" class="search-results-banner" style="display: none; margin-bottom: 2.5rem; text-align: center;">
    <h1 style="font-family: 'Damion', cursive; color: var(--primary); font-weight: 400; font-size: 2.8rem; margin-bottom: 0.5rem;">Search Results for "<span id="searchQueryTerm"></span>"</h1>
    <p id="searchCountText" style="color: var(--muted-color); font-size: 1.1rem;"></p>
  </div>

  <div class="recipe-grid" id="recipeGrid">
    {{- range .Site.RegularPages }}
      {{- if ne .Params.slug "about" }}
{{ partial "recipe-card.html" . }}
      {{- end }}
    {{- end }}
  </div>
</section>

<script>
  document.addEventListener("DOMContentLoaded", function() {
    const urlParams = new URLSearchParams(window.location.search);
    const rawQuery = urlParams.get("q");
    const query = rawQuery ? rawQuery.trim() : "";

    if (query !== "") {
      const heroSection = document.getElementById("heroSection");
      if (heroSection) {
        heroSection.style.display = "none";
      }

      const banner = document.getElementById("searchResultsBanner");
      const queryTerm = document.getElementById("searchQueryTerm");
      const countText = document.getElementById("searchCountText");
      const grid = document.getElementById("recipeGrid");

      if (banner && queryTerm) {
        queryTerm.textContent = query;
        banner.style.display = "block";
      }

      fetch("/index.json")
        .then(response => response.json())
        .then(data => {
          if (typeof Fuse === "undefined") return;

          const fuse = new Fuse(data, {
            keys: [
              { name: "title", weight: 0.5 },
              { name: "categories", weight: 0.2 },
              { name: "content", weight: 0.3 }
            ],
            threshold: 0.1,
            ignoreLocation: true,
            minMatchCharLength: 2,
            includeScore: true
          });

          const results = fuse.search(query);
          const cardMap = new Map();
          const cards = grid.querySelectorAll(".recipe-card");
          cards.forEach(card => {
            const link = card.querySelector(".recipe-card-title a");
            if (link) {
              const href = link.getAttribute("href");
              cardMap.set(href, card);
              card.style.display = "none";
            }
          });

          let matchCount = 0;
          results.forEach(result => {
            const card = cardMap.get(result.item.permalink);
            if (card) {
              card.style.display = "flex";
              grid.appendChild(card);
              matchCount++;
            }
          });

          if (countText) {
            countText.textContent = `Found ${matchCount} matching recipe${matchCount === 1 ? '' : 's'}.`;
          }
        })
        .catch(err => console.error("Search index error:", err));
    }
  });
</script>
{{ end }}
